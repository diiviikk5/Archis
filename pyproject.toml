[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "archis-fsoc-tracker"
version = "2.0.0"
description = "AI-assisted virtual camera tracking system for FSOC coarse alignment"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {text = "MIT"}
authors = [{name = "Archis FSOC Team"}]
dependencies = [
  "numpy>=2.2,<3",
  "opencv-python-headless>=4.11,<5",
  "PyQt6>=6.8,<7",
  "PyQt6-Fluent-Widgets>=1.7,<2",
  "pyqtgraph>=0.13,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
packaging = ["pyinstaller>=6.16,<7"]

[project.scripts]
archis = "archis_tracker.cli:main"

[tool.setuptools.package-data]
archis_tracker = ["assets/*", "models/*", "presets/*.json"]

[tool.setuptools.packages.find]
include = ["archis_tracker*"]
exclude = ["archis_tracker.tests*"]

[tool.pytest.ini_options]
testpaths = ["archis_tracker/tests"]
addopts = "-q"
