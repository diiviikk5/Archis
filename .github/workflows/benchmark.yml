name: Tracking Specification Benchmark
on: [push]
jobs:
  benchmark:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Run verification audit
        run: python -m archis_tracker.main --benchmark --duration 10.0
